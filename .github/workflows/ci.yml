name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.10
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .[dev]
      - run: pytest
      - name: smoke-import every script
        run: |
          for script in scripts/*.py; do
            python "$script" --help > /dev/null
          done
      - name: training entrypoint reaches the trainer (catches missing training deps)
        run: |
          python -c "
          from sentence_transformers import SentenceTransformerTrainingArguments
          SentenceTransformerTrainingArguments(output_dir='/tmp/smoke', eval_strategy='no')
          print('trainer arguments constructible')
          "
